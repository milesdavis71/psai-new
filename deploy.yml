name: Build & FTP Deploy (Foundation)

on:
  push:
    branches: [ "main" ]

env:
  # Kötelező: Repo → Settings → Secrets
  FTP_HOST: ${{ secrets.FTP_HOST }}
  FTP_USER: ${{ secrets.FTP_USER }}
  FTP_PASS: ${{ secrets.FTP_PASS }}

  # Változtatható beállítások (Repo → Settings → Variables)
  FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || 'www/teszt/' }}   # <- IDE TETTÜK A www/-t
  FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftp' }}        # 'ftp' vagy 'ftps'

  # Assets módok: 'none' | 'allowlist' | 'all'
  ASSETS_MODE: ${{ vars.ASSETS_MODE || 'none' }}
  # Csak 'allowlist' módban számít (JSON tömb string): pl. '["images","fonts"]'
  ASSETS_SUBFOLDERS: ${{ vars.ASSETS_SUBFOLDERS || '[]' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - name: Save dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  # 1) Alap feltöltés: dist/ → www/
  #    - 'all' módban NINCS assets kizárás
  deploy-base-all:
    needs: build
    if: ${{ env.ASSETS_MODE == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: FTP deploy (ALL: dist + assets)
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PASS }}
          protocol: ${{ env.FTP_PROTOCOL }}
          local-dir: dist
          server-dir: ${{ env.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.vscode/**
            **/.DS_Store

  # 1/b) Alap feltöltés: dist/ → www/
  #     - 'none' vagy 'allowlist' módban az egész assets kizárva
  deploy-base-noassets:
    needs: build
    if: ${{ env.ASSETS_MODE == 'none' || env.ASSETS_MODE == 'allowlist' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: FTP deploy (NO ASSETS: dist without assets)
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PASS }}
          protocol: ${{ env.FTP_PROTOCOL }}
          local-dir: dist
          server-dir: ${{ env.FTP_SERVER_DIR }}
          exclude: |
            assets/**
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.vscode/**
            **/.DS_Store

  # 2) Csak 'allowlist' módban: kiválasztott assets almappák külön feltöltése
  deploy-assets-allowlist:
    needs: deploy-base-noassets
    if: ${{ env.ASSETS_MODE == 'allowlist' && env.ASSETS_SUBFOLDERS != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        subfolder: ${{ fromJson(env.ASSETS_SUBFOLDERS) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: FTP deploy selected assets/${{ matrix.subfolder }}
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PASS }}
          protocol: ${{ env.FTP_PROTOCOL }}
          local-dir: dist/assets/${{ matrix.subfolder }}
          server-dir: ${{ env.FTP_SERVER_DIR }}/assets/${{ matrix.subfolder }}
          exclude: |
            **/.DS_Store
            **/.git*
            **/.git*/**

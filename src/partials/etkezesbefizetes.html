<ul class="accordion" data-accordion>

    {{#each global.etkezesbefizetes.months}}
  
      <li class="accordion-item {{#if @first}}is-active{{/if}}" data-accordion-item>
  
        <a href="#" class="accordion-title text-center" style="font-size:110%; margin: 0.5em 0 0.5em;">{{ name }}</a>
  
        <div class="accordion-content" data-tab-content>
          <ul class="no-bullet" style="margin: 1em 0 1em;">
            {{#each dates}}
              <li class="text-center">
                <strong>{{ date }}</strong> &emsp13; {{ time }}
              </li>
            {{/each}}
          </ul>
        </div>
  
      </li>
  
    {{/each}}
  
  </ul>

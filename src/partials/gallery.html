{{#each gallery.images}}
<div class="cell small-12 medium-{{../columnsToGrid ../columns}}">
    <a href="#" data-open="modal-{{@index}}">
        <img src="{{src}}" alt="{{alt}}" style="width: 100%; height: auto" />
    </a>
</div>

<!-- Modal for this image -->
<div class="reveal" id="modal-{{@index}}" data-reveal>
    <img src="{{src}}" alt="{{alt}}" style="width: 100%; height: auto" />
    <button
        class="close-button"
        data-close
        aria-label="Close modal"
        type="button"
    >
        <span aria-hidden="true">&times;</span>
    </button>
</div>
{{/each}}

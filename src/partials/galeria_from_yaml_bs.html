<div class="cell medium-9 medium-cell-block-y">
  {{> vissza2}}

  <h5 class="text-center">{{title}}<br>
    <small>{{date}}</small>
  </h5>

  <div class="content">
    <div class="gg-container">
      <div class="gg-box dark" id="square">
        {{#range 1 count pad=2}}
          <img
            src="/assets/img/galeriak/2025_26/bs/{{../slug}}/thumb/{{this}}_thumb.jpg"
            data-full="/assets/img/galeriak/2025_26/bs/{{../slug}}/full/{{this}}_full.jpg"
            alt="{{../title}} – {{this}}"
            loading="lazy">
        {{/range}}
      </div>
    </div>
  </div>

  {{>grid_gallery_js}}

  {{> vissza2}}
</div>

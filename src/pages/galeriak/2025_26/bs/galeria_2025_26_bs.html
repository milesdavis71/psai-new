--- layout: default title: Galéria gallery: gallery.yml

<div
    class="grid-x grid-margin-x small-up-1 medium-up-2 large-up-3"
    id="gallery"
>
    {{#each gallery}}
    <div class="cell">
        <a
            href="{{full}}"
            data-pswp-width="{{width}}"
            data-pswp-height="{{height}}"
            data-cropped="true"
            target="_blank"
        >
            <img src="{{thumb}}" alt="{{title}}" class="thumbnail" />
        </a>
    </div>
    {{/each}}
</div>

<!-- PhotoSwipe root -->
<div class="pswp" tabindex="-1" role="dialog" aria-hidden="true"></div>

---
layout: default
title: Galériák főoldala
---

<main class="grid-container">
    <div class="grid-x grid-margin-x small-up-1 medium-up-2 large-up-4">
        {{#each galleries}}
        <div class="cell">
            <div class="card" style="height: 100%">
                <a href="/galeriak/{{slug}}.html" aria-label="{{title}}">
                    <img src="{{cover_thumb}}" alt="{{title}}" loading="lazy" />
                </a>
                <div class="card-section">
                    <h2 class="h5" style="margin-bottom: 0.25rem">
                        <a href="/galeriak/{{slug}}.html">{{title}}</a>
                    </h2>
                    {{#if date}}
                    <p
                        class="text-muted"
                        style="font-size: 0.9rem; margin-bottom: 0.5rem"
                    >
                        {{date}}
                    </p>
                    {{/if}} {{#if description}}
                    <p style="margin-bottom: 0">{{description}}</p>
                    {{/if}}
                </div>
            </div>
        </div>
        {{/each}}
    </div>
</main>

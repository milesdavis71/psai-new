sections:
  - title: PS HAT24
    content:
      - type: maintitle
        text: Erdélyország gyöngyszemei
      - type: date
        text: 2025. 04. 30. – 2025. 05. 04.
      - type: paragraph
        text: „Ezt a naplót azért írtuk, mert annyi király dolog történt velünk, hogy kár lenne csak magunknak megtartani! Így legalább ti is bepillanthattok, mi mindenről maradtatok le – iskolatársak, családtagok, barátok, figyelem! 😄”
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_24/full/01.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_24/tumb/01.jpg
            alt: Kép 1
      - type: paragraph
        text: 'Valamikor nyáron jött a nagy hír: az iskolánk pályázik a Határtalanul! programra!'
      - type: paragraph
        text: 'Ha nyerünk, öt teljes napot Erdélyben tölthetünk együtt! Először csak néztünk nagyokat, aztán jöttek a fülig érő mosolyok – ez tutira valami izgalmas lesz!'
      - type: paragraph
        text: 'Aztán vártunk... vártunk... még egy kicsit vártunk... és egyszer csak novemberben a Facebook-csoportban megjelent egy üzenet: NYERTÜNK! Megyünk!'
      - type: paragraph
        text: 'Aki ezt olvasta, tuti nem bírta ki ugrálás nélkül!'
      - type: paragraph
        text: 'Tudtuk, hogy sok előkészület lesz, de ez senkit nem zavart. Már akkor éreztük, hogy ez a kirándulás nem olyan lesz, mint a többi. Öt nap Erdélyben? Naná, hogy már akkor elkezdtük visszaszámolni a napokat!'
      - type: paragraph
        text: 'Ahogy jött a tavasz, minden komolyabb lett. Osztályfőnöki órákon egyre többet beszéltünk az útról, és jöttek az előkészítő foglalkozások is. Volt itt történelem, földrajz, beszélgetés, kérdezz-felelek. Viki néni olyan érdekesen mesélt Erdély múltjáról, a fejedelmekről meg mindenféle kalandos dolgokról, hogy még azok is figyeltek, akik amúgy nem szoktak (nem mondunk neveket 😄).'
      - type: paragraph
        text: 'Földrajzórán megtanultuk, hol vannak a hegyek, folyók, városok – és közben már elképzeltük, hogy mi is ott állunk majd.'
      - type: paragraph
        text: 'Gyöngyi néni pedig megtanított minket a székely himnuszra. Eleinte elég komornak tűnt, de a végére úgy énekeltük, mint egy kórus – tiszta szívből. Még a népi hangszerekről is tanultunk, de nem ám unalmasan – inkább nevetve, játékosan.'
      - type: paragraph
        text: 'Az utolsó előkészítőóra már tényleg az utolsó simításokról szólt. Megbeszéltük a részleteket, és a szüleink segítségével ajándékcsomagokat is készítettünk az ottani gyerekeknek. A szülők legalább annyira izgultak, mint mi – volt, aki háromszor is rákérdezett, hogy biztos be van-e csomagolva a fogkefe.'
      - type: paragraph
        text: 'Viki néni még a személyi igazolványokat is jó előre begyűjtötte – biztos, ami biztos, nehogy valaki otthon hagyja. (Ezért szeretjük őt!)'
      - type: heading
        text: 1. nap – Indulás és az első nagy kalandok
      - type: paragraph
        text: 'Hajnalban a rigókkal keltünk és 5-kor már mindenki a buszmegállóban toporgott, hatalmas szemekkel. Érdekes, most senki nem aludt el, mint iskolaidőben az első órákról.'
      - type: paragraph
        text: 'Gyorsan a határhoz értünk, ahol minden fennakadás nélkül átjutottunk. Az első megállónk Déva vára volt. Már messziről kiszúrtuk a felvonót, és izgatottan vártuk, hogy végre felszállhassunk rá. Amikor odaértünk, kiderült, hogy sajnos épp javítják. Sebaj, gondoltuk, nekivágunk gyalog! Jólesett egy kis mozgás a hosszú buszozás után, és közben egyre közelebb került hozzánk a hatalmas szikla tetején álló vár.'
      - type: paragraph
        text: 'A vár 250 méter magas dombon trónol – olyan volt, mintha egy mesébe csöppentünk volna. Ott fenn a sziklán sétálgatni igazi különleges élmény volt, még akkor is, ha közben lecsorgott rólunk a víz a melegtől.'
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_24/full/02.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_24/tumb/02.jpg
            alt: Kép 1
      - type: paragraph
        text: 'Ezután irány Gyulafehérvár!'
      - type: paragraph
        text: 'Már ismerősen csengett a neve – ugye, az Egri csillagokban is szó volt róla! Ráadásul Viki néni is sokat mesélt nekünk erről a városról, különösen Hunyadi Jánosról, meg a fiáról, Lászlóról. Már alig vártuk, hogy élőben is láthassuk azt a híres, ezeréves székesegyházat!'
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_24/full/03.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_24/tumb/03.jpg
        alt: Kép 1
      - type: paragraph
        text: 'Amikor beléptünk, egy pillanatra mindenki elnémult. Komolyan, mintha megállt volna az idő – csak bámultuk a hatalmas, gyönyörű templomot. Tátott szájjal, csillogó szemmel.'
      - type: paragraph
        text: 'Megkerestük a Hunyadiak sírjait, és elhelyeztük a koszorúnkat. Az egyik Hunyadi Jánosé volt, akiről mindenki tudja, hogy igazi hős volt, a másik pedig a fiáé, Lászlóé – akinek szomorú véget ért az élete. Ez a pillanat egy kicsit csendesebb, meghatóbb volt. Olyan igazi „emlékezzünk együtt” érzés.'
      - type: paragraph
        text: 'Aztán tovább indultunk – és csak később jöttünk rá, hogy még mennyi utazás vár ránk aznap…'
      - type: paragraph
        text: 'Déva és Gyulafehérvár után Nagybaromlak felé vettük az irányt (igen, tényleg így hívják! 😄). Itt egy régi szász erődtemplomot néztünk meg – és ami a legmenőbb: ezt a templomot még ma is használják azok a szászok, akik ott élnek. Képzeljétek el, milyen lehet egy ilyen több százéves templomba járni vasárnaponként!'
      - type: paragraph
        text: 'De a legizgalmasabb rész csak ezután jött: felmászhattunk a csigalépcsőkön egészen a harangokig! '
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_24/full/04.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_24/tumb/04.jpg
            alt: Kép 1
      - type: paragraph
        text: 'Na, ez nem volt semmi… A lépcső szűk volt, meredek, minden lépésnél nyikorgott valami – olyan érzésünk volt, mintha bármelyik pillanatban elszállhatnánk az időben. Volt, aki meg se mert mozdulni ott fönt!'
      - type: paragraph
        text: 'És akkor valaki – neveket most se mondunk 😄 – megkongatta a harangot. Hát, azt hittük, ott helyben kiugrik a szívünk! A hangja akkora volt, hogy még percekig csengett a fülünkben.'
      - type: paragraph
        text: 'Innen aztán végre a szállásunkra indultunk – irány Székelyvarság, egészen pontosan a Csorgókő Panzió!'
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_24/full/05.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_24/tumb/05.jpg
            alt: Kép 1
      - type: paragraph
        text: 'Már nagyon vártuk, hogy megérkezzünk, mert a sok utazás és a lépcsőmászás után mindenki kicsit „lemerült”. De amikor megérkeztünk, azonnal jobb kedvünk lett – nagyon kedvesen fogadtak minket, szinte úgy éreztük, mintha hazaértünk volna.'
      - type: paragraph
        text: 'A hab a tortán a meleg vacsora volt! Az illatok már a folyosón becsaptak minket, és amikor leültünk enni, csak annyit mondtunk: „Ez most nagyon kellett!”'
      - type: paragraph
        text: 'Finom volt, laktató, és utána már csak egy vágyunk volt: ágy és alvás. (Na jó, egy kis beszélgetés még belefért a szobákban, de aztán tényleg kidőltünk.)'
      - type: heading
        text: 2. nap – barlang, tó, híd és kürtőskalács
      - type: paragraph
        text: 'Másnap korán reggel már úton is voltunk – irány a Súgó-barlang!'
      - type: paragraph
        text: 'A túravezetőnk egy nagyon laza, vicces bácsi volt, Robi, aki egész nap velünk tartott, és annyi érdekességet mesélt, hogy néha még jegyzetelni is kedvünk lett volna (na jó, csak majdnem 😄).'
      - type: paragraph
        text: 'A barlangig vezető út nem volt piskóta – meredek hegyoldalon kellett felfelé kapaszkodni, de mi hősiesen kitartottunk! És amikor végre beértünk a barlangba… hát, minden fáradtságot megért. Cseppkövek mindenütt, mintha egy varázslatos mesevilágba csöppentünk volna.'
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_24/full/06.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_24/tumb/06.jpg
            alt: Kép 1
      - type: paragraph
        text: 'A legizgibb rész még csak ezután jött: Robi szólt, hogy most mindenki kapcsolja le a zseblámpát. Először csak nevetgéltünk, aztán beállt a totális sötétség és csönd. Se fény, se hang – csak mi és a barlang. Furcsa és kicsit hátborzongató érzés volt, de közben nagyon különleges is. Olyasmi, amit az ember soha nem felejt el.'
      - type: paragraph
        text: 'A Súgó-barlang után újabb csoda következett: elmentünk a Gyilkos-tóhoz! Már a neve is sejteti, hogy nem akármilyen hely… Itt megjutalmaztuk magunkat egy finom kürtőskaláccsal, hogy legyen erőnk a következő túrához.'
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_24/full/07.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_24/tumb/07.jpg
            alt: Kép 1
      - type: paragraph
        text: 'Mert bizony várt ránk a Békás-szoros is! Ez a hely egyszerűen lélegzetelállító – hatalmas sziklafalak, alattunk a Békás-patak, körülöttünk a természet minden csodája. Mintha egy képeslap közepén sétálnánk.'
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_24/full/08.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_24/tumb/08.jpg
            alt: Kép 1
      - type: paragraph
        text: 'És hogy ne legyen túl könnyű a nap: át kellett mennünk egy függőhídon is!'
      - type: paragraph
        text: 'Na, ott volt sikítás, nevetés, óvatos lépések meg bátorítás. De végül mindenki átkelt – és nagyon büszkék voltunk magunkra!'
      - type: paragraph
        text: 'Este visszaértünk Székelyvarságra, ahol Zsuzsika néni újra valami csodát főzött. A szállásunk egy csodás, biztonságos helyen volt – igazi gyerekparadicsom! Minden este felszabadultan rohangálhattunk, focizhattunk, röpizhettünk, vagy csak egyszerűen együtt nevetgéltünk a játszótéren. Mindenki megtalálta a kedvenc elfoglaltságát, és ami még jobb: egymást is. Olyan jó volt ott lenni, hogy néha még vacsorára is nehéz volt behívni minket, nemhogy aludni küldeni!'
      - type: heading
        text: 3. nap – az ezer éves határ és az esztena meglepetései
      - type: paragraph
        text: 'Korán reggel indultunk Gyimesbe, ahol már várt ránk Fülöp bácsi.'
      - type: paragraph
        text: 'Először a Kontumáci kápolnánál álltunk meg, ahol Fülöp mesélt nekünk a csángók életéről. Tudtátok, hogy ők egy igazán különleges közösség? A valaha volt legkeletibb határvonalnál élnek, és az életük nem mindig könnyű – sokat küzdenek, hogy megőrizzék a hagyományaikat és a kultúrájukat.'
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_24/full/09.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_24/tumb/09.jpg
            alt: Kép 1
      - type: paragraph
        text: 'Délután pedig a hegyek között töltöttük az időt, a Hidegség nevű helyen. Ott, a Muhos patak mellett volt egy esztena (ez olyan, mint egy régi parasztház meg a környéke), ahol szalonnát és kolbászt sütöttünk. Megmutatta a sajtkészítés minden lépését, és azt is, hogyan használják az oltógyomrot (ami... hát, nem volt a lányok kedvence, sőt, volt, aki kicsit rosszul is lett tőle 😄).'
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_24/full/10.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_24/tumb/10.jpg
            alt: Kép 1
      - type: paragraph
        text: Hát, az ízek… egyszerűen mennyei volt!
      - type: paragraph
        text: Ott, a természet közepén, hallgattuk az itt élő emberek sokszor nagyon nehéz, de szép életútját. Egyszerre volt szomorú és nagyon különleges élmény is.
      - type: paragraph
        text: 'Este még egy meglepetés várt ránk: a helyi iskolások néptánc-bemutatója! A vezetőjük köszöntött minket, megmutatták a szép népi viseletüket, majd táncoltak, énekeltek nekünk – és képzeljétek, mikrofon nélkül! Olyan erősen és szépen énekeltek, hogy mindenkinek libabőrös lett a karja. Mi is bemutatkoztunk, elmondtuk, honnan jöttünk, és elénekeltük velük együtt a Tavaszi szél vizet áraszt című népdalt.'
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_24/full/11.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_24/tumb/11.jpg
        alt: Kép 1
      - type: paragraph
        text: Valahogy ezen az estén mindenki megváltozott egy kicsit. Nem tudjuk megmagyarázni, de olyan érzésünk volt, mintha ez a közös éneklés és tánc összekötött volna minket. Ettől a perctől kezdve már nem csak osztálytársak voltunk, hanem egy igazi csapat. Barátkoztunk, nevettünk, táncoltunk – és ez volt az egyik legszebb este az egész út alatt.
      - type: heading
        text: 4. nap – sós levegő, zötyögés, vízesés és egy csipetnyi szomorúság
      - type: paragraph
        text: Reggel ismét korán kelés – már egész jól ment –, gyors reggeli, aztán szendvicsgyártás. Készülődtünk, mert sűrű nap várt ránk. Első állomásunk Szejkefürdő volt, ahol egy különleges székelykapus sétány vezetett fel Orbán Balázs sírjához. Ő egy híres székely író és utazó volt, aki sokat tett azért, hogy megismerjük Erdélyt. Koszorút is elhelyeztünk, ahogy ilyenkor illik.
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_24/full/12.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_24/tumb/12.jpg
        alt: Kép 1
      - type: paragraph
        text: Ezután irány Parajd, ahol a sóbánya várt ránk! Már maga a lejutás is izgalmas volt, de odalent mindenkit elvarázsolt a hatalmas tér és a sós levegő. Nemcsak nézelődni lehetett, hanem hintázni, röpizni, tollasozni, és sokan minden játékot kipróbáltak.
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_24/full/13.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_24/tumb/13.jpg
        alt: Kép 1
      - type: paragraph
        text: Délután szekerekkel mentünk a Csorgókő-vízeséshez – olyan volt, mintha egy igazi időutazásba csöppentünk volna! Rázkódott minden, de közben rengeteget nevettünk és beszélgettünk.
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_24/full/14.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_24/tumb/14.jpg
        alt: Kép 1
      - type: paragraph
        text: A vízesés csodás volt, a víz csobogása teljesen lenyűgözött minket.
      - type: paragraph
        text: 'Utána felmásztunk az ötszintes kilátóra, ahonnan le a völgybe nézve egyszerűen lélegzetelállító volt a látvány. Székelyvarság dombjai olyan káprázatosan kanyarogtak előttünk, hogy még a legjobb festő is megirigyelhette volna!'
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_24/full/15.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_24/tumb/15.jpg
            alt: Kép 1
      - type: paragraph
        text: 'Ott fent a kilátón állva tényleg éreztük, milyen szép a természet'
      - type: paragraph
        text: 'Este aztán elérkezett az utolsó vacsora, amit egyikünk sem akart igazán elhinni.'
      - type: paragraph
        text: 'De Zsuzsika néni megint meglepett minket valami szuper finomsággal: töltött káposzta, almáspite – és persze nem maradhatott el a házi leves sem. Mmm, az illatok már az asztalnál megfogtak minket!'
      - type: paragraph
        text: 'Miközben ettünk, megköszöntük neki meg a családjának, hogy ilyen jól éreztük magunkat náluk. Olyan megható pillanat volt, hogy többen csendben maradtunk – még a vidám csapatból is! Valahogy senki nem akart még hazamenni.'
      - type: paragraph
        text: 'Aznap este, amikor pakoltunk, mindenkiben ott motoszkált egy kis szomorúság. Mégiscsak vége lett a kalandnak… de tudtuk, hogy ez az út örökre megmarad a szívünkben.'
      - type: heading
        text: 5. nap – Petőfi nyomában és búcsú Erdélytől
      - type: paragraph
        text: 'Vegyes érzésekkel indultunk haza. Egyrészt nagyon sajnáltuk, hogy vége a fantasztikus kalandoknak, de azért örültünk is, mert este végre újra láthatjuk a családunkat.'
      - type: paragraph
        text: 'Első megállónk Fehéregyháza volt, ahol a Petőfi Múzeumba mentünk. Ott egy igazán izgalmas előadást hallgattunk meg, ami teljesen lekötött minket. Az előadás után elhelyeztünk egy koszorút Petőfi Sándor emlékére, és elénekeltük a Székely himnuszt – közösen, szívből.'
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_24/full/16.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_24/tumb/16.jpg
            alt: Kép 1
      - type: paragraph
        text: 'Aztán Segesvárra érkeztünk, ahol sétáltunk egy nagyot a vár területén. Megmásztuk a híres Diákok lépcsőjét, és megnéztük Petőfi szobrát is. Itt már éreztük, hogy lassan tényleg búcsúzunk Erdélytől, de a szívünkben sok szép emlék maradt.'
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_24/full/17.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_24/tumb/17.jpg
      - type: paragraph
        text: 'Megkezdődött a hazautunk – kb. 6 óra buszozás várt ránk. Nagylaknál egy hatalmas kamionsor állt a határon, már azt hittük, sose jutunk át. De a sofőrünk profin tudta, hova kell sorolni, így gyorsan átvitt minket a határon. Este 8-kor visszaértünk Szegedre, ahol a szülők már alig várták, hogy újra lássanak minket.'
      - type: paragraph
        text: Elfáradtunk. De annyi mindent láttunk, tanultunk és átéltünk, hogy örökre megmarad bennünk.
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_24/full/18.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_24/tumb/18.jpg
            alt: Kép 1
      - type: heading
        text: Értékelő óra – újra együtt, kicsit másképp
      - type: paragraph
        text: 'Miután hazaértünk, és mindenki kialudta magát (vagy legalábbis megpróbálta), tartottunk egy külön órát, ahol csak mi voltunk jelen – meg persze a felkészítő tanáraink, akik nélkül ez az egész nem jöhetett volna létre.'
      - type: paragraph
        text: 'Leültünk körben, és mindenki elmondhatta, mi volt számára a legjobb élmény, mit tanult, mi volt vicces, és mi volt nehéz. Jókat nevettünk, mert ahogy felidéztük a pillanatokat, újra ott éreztük magunkat Erdélyben. Közösen válogattunk képeket, amiket feltettünk az iskola Facebook-oldalára, és videókat is megnéztünk a digitális táblán. Néha felkiáltottunk: „Nézd, ott vagyok én is!” – vagy: „Mikor indulunk vissza, Erdélybe?”'
      - type: paragraph
        text: Sok emlék, sok nevetés, és egy kis hiányérzet, hogy véget ért.
      - type: heading
        text: Témanap
      - type: paragraph
        text: 'Úgy gondoltuk, hogy ezt a rengeteg dolgot, amit láttunk és történt velünk, azt mindenképpen érdemes megosztani a társainkkal, ezért szerveztünk egy kis bemutatót. Itt előadtuk a dalokat, amiket tanultunk, megkínáltuk őket az Erdélyből hozott lekváros kenyérrel és rengeteg élményt osztottunk meg velük.'
      - type: paragraph
        text: 'Röviden összefoglalva kedves naplónk, ezek történtek. '
      - type: paragraph
        text: 'Köszönjük az Emberi Erőforrás Minisztériumának a pályázati támogatást, a sok kedves embernek, akik segítettek minket az utunk során, és persze Viki és Rita néninek azt, hogy el mertek minket vinni ilyen messzire és végig gondoskodtak rólunk.'
  - title: BS HAT24
    content:
      - type: maintitle
        text: „Te látó ember leszel, ugye?”
      - type: date
        text: (Wass Albert)
      - type: date
        text: 2025. 04. 30. – 2025. 05. 04.
      - type: paragraph
        text: Azért írtuk ezt a naplót, hogy ne csak mi őrizzük meg a sok szép emléket, hanem megmutathassuk az iskolatársainknak, a családunknak és a barátainknak is, milyen klassz dolgok történtek velünk!
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_24/full/01.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_24/thumb/01.jpg
            alt: Kép 1
      - type: paragraph
        text: Tudtuk, hogy sok előkészület vár ránk, de ez senkit nem zavart. Már akkor sejtettük, hogy felejthetetlen élményben lesz részünk. Egy öt napos kirándulás, ráadásul Erdélyben? Hát persze, hogy izgatottan számoltuk vissza a napokat!
      - type: paragraph
        text: Ahogy közeledett a tavasz, egyre komolyabb lett a dolog. Több osztályfőnöki órán is beszéltünk az útról, és előkészítő foglalkozásokat is tartottunk. Történelem, földrajz, és sok érdekes beszélgetés. Bea néni elvarázsolt minket Erdély múltjával, a fejedelmek történeteivel. Földrajz órán megismertük Erdély hegyeit, folyóit, városait. Az igazgatóhelyettes néni is csatlakozott hozzánk – ő már sokszor járt ott, és szuper történeteket mesélt a helyi emberekről meg nevezetességekről. Gyöngyi néni megtanította nekünk a székely himnuszt – eleinte kicsit szomorúnak éreztük, de a végére szépen, szívből tudtuk elénekelni. Még a népi hangszerekről is tanultunk, játékosan, vidáman.
      - type: paragraph
        text: 'Az utolsó előkészítőóra pár nappal az indulás előtt volt. Itt már tényleg minden a helyére került: megbeszéltük az utolsó részleteket, és a szüleink segítségével összeállítottuk az ajándékcsomagokat a kint élő gyerekeknek. A szülők legalább annyira izgultak, mint mi! Nóri néni még a személyi igazolványainkat is jó előre összegyűjtötte, nehogy valaki otthon felejtse. Biztosra ment – szerencsére!'
      - type: heading
        text: 1. nap – Indulás és az első nagy kalandok
      - type: paragraph
        text: Hajnali ötkor már mindenki a buszmegállóban toporgott, álmos, de izgatott szemekkel. Most senki nem késett el, sőt – mindenki időben ott volt (ez amúgy ritka!). Gyorsan a határhoz értünk, és simán átjutottunk.
      - type: paragraph
        text: Az első megállónk Déva vára volt. Már messziről láttuk a felvonót, és alig vártuk, hogy beszállhassunk. Csakhogy a vár felvonóját javították, így gyalog indultunk meg felfelé. Jól is esett ez a kis séta a hosszú út után. A vár 250 méter magas sziklán áll – ott barangolni nagyon különleges élmény volt, még a meleg ellenére is.
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_24/full/02.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_24/thumb/02.jpg
            alt: Kép 1
      - type: paragraph
        text: Ezután Gyulafehérvár felé vettük az irányt. Ezt a várost már ismertük az Egri csillagokból, és Bea néni is sokat mesélt róla – különösen Hunyadi Jánosról és a fiáról, Lászlóról. Már nagyon vártuk, hogy láthassuk az 1000 éves székesegyházat. Amikor beléptünk, elállt a lélegzetünk. Komolyan, tátott szájjal néztük a hatalmas, gyönyörű templomot. Megkerestük a Hunyadi-sírokat, és elhelyeztük a koszorút – az egyik a törökverő hősé, a másik a tragikus sorsú fiáé, Lászlóé. Ezután tovább indultunk… és csak később jöttünk rá, hogy még milyen hosszú út áll előttünk.
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_24/full/03.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_24/thumb/03.jpg
        alt: Kép 1
      - type: paragraph
        text: Utunk folytatódik...
      - type: paragraph
        text: Déva és Gyulafehérvár után Nagybaromlak felé vettük az irányt. Itt egy szász erődtemplomot néztünk meg, amit ma is használnak azok a szászok, akik még ott élnek. A legizgalmasabb az volt, amikor a csigalépcsőkön felmászhattunk egészen a harangokig. Elég félelmetes volt – szűk, magas, és recsegett-ropogott minden. Valaki meg is kongatta a harangot, amitől majd’ kiugrott a szívünk – akkora hangja volt!
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_24/full/04.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_24/thumb/04.jpg
            alt: Kép 1
      - type: paragraph
        text: Késő délután értünk a szállásra, Székelyvarságba. Már az is kaland volt, mire a busz beállt a parkolóba – nem volt egyszerű manőver. A teraszon ott várt ránk Zsuzsika néni, a Csorgókő Panzió kedves tulajdonosa, és tényleg úgy örült nekünk, mintha régi ismerősök lennénk.
      - type: paragraph
        text: A szállás... hát mit is mondjunk? Inkább emlékeztetett egy kis luxus hotelre! Külön szobák, saját fürdő, és általában ketten laktunk egy szobában. A tanári szoba pont középen volt – gyanús, hogy ez nem véletlen... Nehéz is lett volna titokban mászkálni, mert a faházban minden lépés hallatszott!
      - type: paragraph
        text: A szállásunk környéke olyan volt, mint egy nagy játszótér, amit csak nekünk találtak ki! Biztonságos, barátságos, és tele volt lehetőséggel a mókára. Amint letettük a csomagjainkat, már szaladtunk is focizni, röplabdázni, vagy épp a játszótéren kergettük egymást, mintha soha nem fáradnánk el. Minden este olyan volt, mint egy mini fesztivál – csak mi, a barátaink, meg egy csomó nevetés. Néha még azt is elfelejtettük, hogy este van, annyira nem akartunk bejönni. Komolyan, néha már trükközni kellett, hogy valaki végre hajlandó legyen lezuhanyozni!
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_24/full/05.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_24/thumb/05.jpg
            alt: Kép 1
      - type: paragraph
        text: A vacsorára egyszerűen nincsenek szavak. Három fogás, házi alapanyagokból, nagy szeretettel készítve. Olyan ízeket ettünk, amit otthon ritkán. Este 10 körül tanáraink megpróbálták lefektetni az osztályt – de kevés sikerrel. Szerintünk a 90%-unk egy percet sem aludt. Túl izgatottak voltunk!
      - type: heading
        text: 2. nap – barlang, tó, híd és kürtőskalács
      - type: paragraph
        text: Reggel 6:45-kor szólt az ébresztő. Gyors készülődés után, reggelivel a hasunkban újra buszra szálltunk. Előre tudtuk, mi lesz a napi program – tanáraink mindig pontosan elmondták, mire készüljünk és mit pakoljunk a hátizsákba. Azt viszont nem sejtettük, milyen különleges nap vár ránk. A busz hátsó részében olyan jó volt a hangulat, hogy észre sem vettük, amikor Robi, a túravezetőnk, felszállt. Nagyon másképp beszélt, mint mi, de minden szava érdekes volt. Tőle tanultuk a „veddfelke” szót – ez egy meleg pulóvert jelentett, amit a barlangba kellett vinnünk.
      - type: paragraph
        text: Egy rövid, de meredek túra után elértük a Sugó-barlangot. Fejlámpát kaptunk, és be is mentünk. Bent csúszós volt a talaj, néha le kellett hajolni – aki nem figyelt, be is verte a fejét. Robi elmondta, hogy ez a barlang a Gyergyói-medence egyik legfontosabb természeti kincse, főleg a benne élő különleges denevérek miatt. És tényleg jól jött a veddfelke – odabent csak 7–12 fok volt!
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_24/full/06.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_24/thumb/06.jpg
            alt: Kép 1
      - type: paragraph
        text: 'Ezután buszra szálltunk és meg sem álltunk a Gyilkos-tóig. Itt mindenki kapott egy igazi helyi kürtőskalácsot. Komolyan mondjuk: életünk legfinomabb kalácsa volt! Innen gyalog mentünk tovább a Békás-szorosba. A patakról kapta a nevét, ami végig kísért minket. A sziklafalak hatalmasak, lenyűgöző volt ott sétálni.'
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_24/full/07.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_24/thumb/07.jpg
            alt: Kép 1
      - type: paragraph
        text: 'Robi elvitt minket egy titkos helyre is, amit csak a legjobb gyerekeknek szokott megmutatni: egy függőhídhoz, amit ő „kis Békásnak” hívott. Kettő átkelést tervezett, de medveriasztást kaptunk, így az első híd után visszafordultunk. Ez is nagy élmény volt!'
      - type: paragraph
        text: A Gyilkos-tó keletkezéséről már Bella nénitől, a földrajzórákon is tanultunk, most Robi is elmagyarázta – a földcsuszamlás hogyan torlaszolta el a vizet. Próbáltuk jól megjegyezni, mert a kiálló fatörzsek egyszer majd teljesen eltűnhetnek.
      - type: paragraph
        text: Este visszaértünk Székelyvarságra, ahol Zsuzsika néni újra valami csodát főzött. Közös játék és nevetés zárta a napot – tanáraink este 10-kor alig bírtak lefogni minket. 😊
      - type: heading
        text: 3. nap – az ezer éves határ és az esztena meglepetései
      - type: paragraph
        text: 'Ezen a napon is korán keltünk, mert tanáraink előre figyelmeztettek: ma messzire megyünk! A buszból nézve gyönyörű volt a táj – zöld dombok, hegyek, kis házak mindenfelé. Útban az ezer éves határ felé megálltunk egy régi vasúti őrháznál, ami olyan volt, mint egy időutazás. Szerettük volna megnézni a Rákóczi-várat is, de sajnos felújítás alatt volt – úgyhogy azt majd legközelebb!'
      - type: paragraph
        text: 'Aztán megérkeztünk a Kontumáci kápolnához, ahol már várt minket Fülöp bácsi, a helyi idegenvezető. Nagyon kedves ember volt, érdekes dolgokat mesélt nekünk a csángókról – kiderült, hogy háromféle csoportjuk van: moldvai, gyimesi és hétfalusi. Ezt jól meg is jegyeztük, mert úgy mesélte el, hogy közben szinte láttuk magunk előtt az egészet.'
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_24/full/08.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_24/thumb/08.jpg
            alt: Kép 1
      - type: paragraph
        text: 'A legnagyobb meglepetés viszont az volt, amikor meghívott minket a saját esztenájába. Fogalmunk sem volt, mi az az esztena, de kiderült, hogy ez egy olyan hely, ahova tavasszal kiköltöznek az állatokkal, és ott maradnak egész nyáron, amíg be nem köszönt a tél. Olyan volt, mint egy nyári tanyavilág – hegyek között, friss levegőn.'
      - type: paragraph
        text: Ott megmutatta a sajtkészítés minden lépését, és azt is, hogyan használják az oltógyomrot (ami... hát, nem volt a lányok kedvence, sőt, volt, aki kicsit rosszul is lett tőle 😄).
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_24/full/09.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_24/thumb/09.jpg
            alt: Kép 1
      - type: paragraph
        text: 'Aztán jött a tábortűz, ami igazi kaland volt! Mindenki maga sütötte meg a szalonnáját, kolbászát, és Fülöp bácsi saját készítésű pityókás kenyeret adott hozzá – mennyei volt. Kóstoltunk háromféle sajtot is, de az osztály nagy része egyetértett: a középső volt a legfinomabb!'
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_24/full/10.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_24/thumb/10.jpg
            alt: Kép 1
      - type: paragraph
        text: Ebéd után még kóboroltunk egy kicsit az esztena körül, mászkáltunk a domboldalon, fotóztunk, de aztán Katinka néni finoman jelezte, hogy ideje búcsút venni. Visszautaztunk Székelyvarságra, ahol Zsuzsika néni már újra várt minket a szokásos szeretettel.
      - type: paragraph
        text: 'Este még egy meglepetés várt ránk: a helyi iskolások néptánc-bemutatója! A vezetőjük köszöntött minket, megmutatták a szép népi viseletüket, majd táncoltak, énekeltek nekünk – és képzeljétek, mikrofon nélkül! Olyan erősen és szépen énekeltek, hogy mindenkinek libabőrös lett a karja. Mi is bemutatkoztunk, elmondtuk, honnan jöttünk, és elénekeltük velük együtt a Tavaszi szél vizet áraszt című népdalt.'
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_24/full/11.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_24/thumb/11.jpg
        alt: Kép 1
      - type: paragraph
        text: Valahogy ezen az estén mindenki megváltozott egy kicsit. Nem tudjuk megmagyarázni, de olyan érzésünk volt, mintha ez a közös éneklés és tánc összekötött volna minket. Ettől a perctől kezdve már nem csak osztálytársak voltunk, hanem egy igazi csapat. Barátkoztunk, nevettünk, táncoltunk – és ez volt az egyik legszebb este az egész út alatt.
      - type: heading
        text: 4. nap – sós levegő, zötyögés, vízesés és egy csipetnyi szomorúság
      - type: paragraph
        text: Reggel ismét korán kelés – már egész jól ment –, gyors reggeli, aztán szendvicsgyártás. Készülődtünk, mert sűrű nap várt ránk. Első állomásunk Szejkefürdő volt, ahol egy különleges székelykapus sétány vezetett fel Orbán Balázs sírjához. Ő egy híres székely író és utazó volt, aki sokat tett azért, hogy megismerjük Erdélyt. Koszorút is elhelyeztünk, ahogy ilyenkor illik.
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_24/full/12.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_24/thumb/12.jpg
        alt: Kép 1
      - type: paragraph
        text: 'Ezután irány Parajd, ahol a sóbánya várt ránk! Már maga a lejutás is izgalmas volt, de odalent mindenkit elvarázsolt a hatalmas tér és a sós levegő. Nemcsak nézelődni lehetett, hanem hintázni, röpizni, tollasozni, és sokan minden játékot kipróbáltak. Egy apró bonyodalom is akadt: egy labdánk berepült egy fa bódéba, és a pultos néni nem akarta visszaadni. Katinka néni nyugodtan megoldotta a helyzetet, de csak úgy kaptuk vissza, hogy ígéretet tett, elzárja tőlünk. Hát, végül is, úgyis indulnunk kellett tovább…'
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_24/full/13.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_24/thumb/13.jpg
        alt: Kép 1
      - type: paragraph
        text: 'A következő programunk igazi falusi kaland volt: szekereken vágtunk neki az erdőnek! Zötyögött, rázkódott, porzott az út – de mi csak nevettünk és beszélgettünk közben. A Csorgókő-vízesésnél megálltunk, ahol azok, akiknek vízálló cipőjük volt, simán belegázoltak a patakba. Akinek nem volt… hát, azok is vizesek lettek. 😄'
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_24/full/14.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_24/thumb/14.jpg
        alt: Kép 1
      - type: paragraph
        text: 'Ezután felmásztunk egy többemeletes kilátóba, ahol körbe tudtunk nézni – 360 fokban! Az egész környéket beláttuk: fák, hegyek, házak – gyönyörű volt. Ott álltunk fent, és kicsit csendben maradtunk. Még mi is.'
      - type: paragraph
        text: 'Este aztán eljött, amit egyikünk sem várt: az utolsó vacsora. Zsuzsika néni még erre is meglepetéssel készült: töltött káposzta, almáspite – és persze az elmaradhatatlan házi leves. A finom falatok mellett köszönetet mondtunk neki és a családjának. Meg is hatódtunk kicsit – többen nagyon csendesek voltunk. Valahogy senki nem akart hazamenni. Aznap este kicsit szomorkás hangulatban pakoltunk be a bőröndjeinkbe.'
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_24/full/15.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_24/thumb/15.jpg
            alt: Kép 1
      - type: heading
        text: 5. nap – Petőfi nyomában és búcsú Erdélytől
      - type: paragraph
        text: Utolsó reggel, utolsó pakolás, utolsó reggeli. Mindenki csendesebb volt a szokásosnál. A buszba már rutinosan ültünk be – indulás Fehéregyházára. Ott egy kis múzeumban Petőfi Sándorra emlékeztünk. A gondnok bácsi elmesélte, hogy három tömegsír is van a környéken, amelyek közül az egyikben akár Petőfi is nyugodhat. Nem biztos, hogy ő az, de attól még koszorút helyeztünk el az emlékezés szobránál, ahogy a nagy költő megérdemli.
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_24/full/16.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_24/thumb/16.jpg
            alt: Kép 1
      - type: paragraph
        text: Ezután elmentünk Segesvárra, ami egy igazi mesebeli város. Megnéztük az óratornyot, aminek az egyik számlapja a vár, a másik a város felé néz – hogy mindenki tudja, hány óra van. Láttuk Drakula szülőházát is – most étterem működik benne. A diákok lépcsőjét is megmásztuk (hivatalosan 175 lépcső van, de mindenki mást számolt – fáradtan nem volt könnyű pontosnak lenni).
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_24/full/17.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_24/thumb/17.jpg
      - type: paragraph
        alt: Kép 1
      - type: paragraph
        text: Megkezdődött a hazautunk – kb. 6 óra buszozás várt ránk. Nagylaknál egy hatalmas kamionsor állt a határon, már azt hittük, sose jutunk át. De a sofőrünk profin tudta, hova kell sorolni, így gyorsan átvitt minket a határon. Este 8-kor visszaértünk Szegedre, ahol a szülők már alig várták, hogy újra lássanak minket.
      - type: paragraph
        text: Elfáradtunk. De annyi mindent láttunk, tanultunk és átéltünk, hogy örökre megmarad bennünk.
      - type: heading
        text: Értékelő óra – újra együtt, kicsit másképp
      - type: paragraph
        text: Miután hazaértünk, és mindenki kialudta magát (vagy legalábbis megpróbálta), tartottunk egy külön órát, ahol csak mi voltunk jelen – meg persze a felkészítő tanáraink, akik nélkül ez az egész nem jöhetett volna létre.
      - type: paragraph
        text: 'Leültünk körben, és mindenki elmondhatta, mi volt számára a legjobb élmény, mit tanult, mi volt vicces, és mi volt nehéz. Jókat nevettünk, mert ahogy felidéztük a pillanatokat, újra ott éreztük magunkat Erdélyben. Közösen válogattunk képeket, amiket feltettünk az iskola Facebook-oldalára, és videókat is megnéztünk a digitális táblán. Néha felkiáltottunk: „Nézd, ott vagyok én is!” – vagy: „Jaj, ez volt az, amikor a medveriasztás után visszafordultunk!”'
      - type: paragraph
        text: Sok emlék, sok nevetés, és egy kis hiányérzet, hogy véget ért.
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_24/full/18.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_24/thumb/18.jpg
            alt: Kép 1
      - type: paragraph
        text: Röviden összefoglalva, ezek a csodás dolgok történtek velünk az erdélyi utunk során. Hálásan köszönjük az Emberi Erőforrás Minisztériumának a pályázati támogatást, minden kedves embernek, aki segített nekünk közben – akár egy mosollyal, akár egy tál meleg étellel.
  - title: PS HAT23
    content:
      - type: maintitle
        text: „Történelmi megállók Erdélyben”
      - type: date
        text: 2024. június 11–15.
      - type: paragraph
        text: Iskolánk hetedik osztályos tanulóival a Határtalanul! pályázat keretében 2024. június 11 - 15. között Erdélybe utazhattunk, ahol az ott eltöltött öt nap során rendkívül sok érdekes és izgalmas program várt bennünket.
      - type: paragraph
        text: Az utazás előtt tartott előkészítő órákon a diákok felidézték a trianoni békeszerződés során elcsatolt területeken élő magyarság történetét, illetve megismerhették a székely nép sorsát. Interaktív tananyag segítségével a népi hangszerekkel, hagyományokkal foglalkoztunk.
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_23/full/busz.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_23/thumb/busz.jpg
            alt: Kép 1
      - type: heading
        # 1. nap
        text: Első nap
      - type: paragraph
        text: Az indulás napján nagyon korán kellett kelnünk, hiszen hosszú út állt előttünk. Hajnali négy órakor álmosan gyülekeztünk az iskola előtt a buszra várva. Kezdeti fáradtságunk hamar elszállt, hiszen a székelyvarsági szállásra vezető utunkat többször is megszakítottuk egy-egy izgalmas helyszínen.
      - type: paragraph
        text: Déva váránál álltunk meg először. Verőfényes napsütésben sétáltunk a gyönyörűen felújított vár területén, ahova a drótkötélpályás felvonó segítségével jutottunk el.
      - type: paragraph
        text: Folytattuk utunkat Gyulafehérvárra, ahol megtekintettük a székesegyházat, majd a Károly-kapun átsétálva megcsodáltuk a gyönyörű tájat.
      - type: images
        images_per_row: 2
        images:
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_23/full/Déva.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_23/thumb/Déva.jpg
            alt: Kép 3
            caption: Déva
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_23/full/Gyulafehérvár.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_23/thumb/Gyulafehérvár.jpg
            alt: Kép 4
            caption: Gyulafehérvár
      - type: heading
        text: Második nap'
      - type: paragraph
        text: Kirándulásunk második napjának reggelén ellátogattunk a székelyudvarhelyi Emlékezet parkjába, ahol 13 magyar király, író és egyéb híres ember szobránál tettük tiszteletünket. Ezután Szejkefürdőn jártunk, megtekintettük a Székelykapu Múzeumot és Orbán Balázs sírhelyét. Innen Korondra utaztunk és a verőfényes napsütésben helyi kézművesek termékeiből vásárolgattunk, majd egy egészen különös szakma művelőivel, taplász-mesterekkel ismerkedtünk meg. Megmutatták nekünk, hogy hogyan készítenek táskát, kendőt, sapkát és különböző dísztárgyakat taplógombából. Délután szekereken jutottunk el a Csorgókő-vízeséshez, majd az ötszintes kilátóról gyönyörködtünk Székelyvarság káprázatos domborzatában.
      - type: images
        images_per_row: 2
        images:
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_23/full/szejkefurdo.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_23/thumb/szejkefurdo.jpg
            alt: Kép 3
            caption: Szejkefürdő
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_23/full/korond.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_23/thumb/korond.jpg
            alt: Kép 4
            caption: Korond
      - type: images
        images_per_row: 2
        images:
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_23/full/Úton_b_Csorgókő_vízeséshez.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_23/thumb/Úton_a_Csorgókő_vízeséshez.jpg
            alt: Kép 3
            caption: Úton a Csorgókő vízeséshez
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_23/full/Székelyvarság_kilátó.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_23/thumb/Székelyvarság_kilátó.jpg
            alt: Kép 4
            caption: Gyulafehérvár
      - type: heading
        text: Harmadik nap
      - type: paragraph
        text: Kirándulásunk harmadik napján első utunk a Dani Gergely Általános Iskolába vezetett, ami a legkeletibb magyar iskola Gyimesbükkön. A helyi hetedik osztályosok, osztályfőnökük és az iskola igazgatója fogadott minket. Magával ragadó volt a gyermekek nyitottsága, vendégszeretete. Ez a közvetlenség hatott a mi diákjainkra is, akik örömmel vettek részt táncmulatságban, majd közös sporttevékenységben. Fájó szívvel köszöntünk el vendéglátóinktól, akikkel jó barátságot alakítottak ki gyermekek, pedagógusok egyaránt.
      - type: paragraph
        text: A délutánunkat a hegyek között folytattuk a Hidegségben. A Muhos patak mellett fekvő esztenánál szalonnát és kolbászt sütöttünk, valamint házi készítésű sajtot kóstoltunk. A helyi idegenvezető megismertette velünk a gyimesi csángók történetét. Hazafelé menet útba ejtettük az ezeréves határt is, ahol élő történelemórán vettünk részt. Megható volt az itt élő emberek viszontagságos életútját hallgatni ebben a gazdag természeti környezetben.
      - type: images
        images_per_row: 2
        images:
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_23/full/Dani_Gergely_Általános_Iskola.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_23/thumb/Dani_Gergely_Általános_Iskola.jpg
            alt: Kép 3
            caption: Dani Gergely Általános Iskola
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_23/full/muhos_patak_mellett.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_23/thumb/muhos_patak_mellett.jpg
            alt: Kép 4
            caption: A Muhos patak mellett
      - type: images
        images_per_row: 2
        images:
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_23/full/sutogetes_az_esztenanal.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_23/thumb/sutogetes_az_esztenanal.jpg
            alt: Kép 3
            caption: Sütögetés az esztenánál
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_23/full/ezereves_hatarnal.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_23/thumb/ezereves_hatarnal.jpg
            alt: Kép 4
            caption: Az ezeréves határnál
      - type: heading
        text: Negyedik nap
      - type: paragraph
        text: Erdélyi tartózkodásunk negyedik napján korán reggel a Súgó - barlang felé vettük az irányt. Miután megküzdöttünk a meredek hegyoldallal, a barlangban cseppkövek csodálatos látványa fogadott bennünket. A barlang mélyén lekapcsoltuk a zseblámpákat, hogy kipróbáljuk, milyen érzés teljes csendben és vaksötétben lenni.
      - type: paragraph
        text: A Súgó-barlangból egy újabb csodálatosan szép természeti jelenséghez, a Gyilkos-tóhoz indultunk. A Gyilkos-tónál finom kürtős kalácsot ettünk, hogy legyen energiánk a hosszú sétához a Békás-szorosban. Lélegzetelállítóan gyönyörű látványt nyújt a Békás-patak és az azt körülölelő hatalmas sziklafalak. Igazi természeti ritkaság, amit itt láthattunk. A függőhídon való átjutás igazi kihívás elé állította tanulóinkat.
      - type: images
        images_per_row: 3
        images:
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_23/full/gyilkos-to.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_23/thumb/gyilkos-to.jpg
            alt: Kép 3
            caption: Gyilkos-tó
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_23/full/Békás-szoros.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_23/thumb/Békás-szoros.jpg
            alt: Kép 4
            caption: Békás szoros
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_23/full/esti_játék.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_23/thumb/esti_játék.jpg
            alt: Kép 4
            caption: Esti játék
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_23/full/bekas-szoros-csoportkep.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_23/thumb/bekas-szoros-csoportkep.jpg
            alt: Kép 3
            caption: Békás szoros
      - type: heading
        text: Ötödik nap
      - type: paragraph
        text: Az ötödik nap ismét az utazásról szólt. Szívünkben vegyes érzésekkel indultunk haza. Egyrészt sajnáltuk, hogy vége lett a csodás kalandoknak, másrészt örültünk, hogy este végre viszontláthatjuk a családunkat.
      - type: paragraph
        text: Fehéregyházán felkerestük a Petőfi Múzeumot, ahol egy lebilincselő előadás meghallgatása után egy koszorú elhelyezésével emlékeztünk meg Petőfi Sándorról és elénekeltük a Székely himnuszt. Segesváron sétáltunk a vár területén, majd megmásztuk a Diákok lépcsőjét és megnéztük Petőfi szobrát.
      - type: images
        images_per_row: 3
        images:
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_23/full/Fehéregyháza.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_23/thumb/Fehéregyháza.jpg
            alt: Kép 3
            caption: Gyilkos-tó
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_23/full/segesvar.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_23/thumb/segesvar.jpg
            alt: Kép 4
            caption: Békás szoros
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_23/full/Óratorony.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_23/thumb/Óratorony.jpg
            alt: Kép 4
            caption: Esti játék
      - type: paragraph
        text: Kirándulásunk utolsó helyszíne a nagybaromlaki erődtemplom volt. Felmentünk a templomtoronyba, ahonnan csodálatos kilátás nyílt a környező vidékre, felidézve bennünk az összes festői szépségű táj emlékét, melyeket az elmúlt napokban láthattunk.
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/ps/hatartalanul/hat_23/full/Nagybaromlak.jpg
            thumb: /assets/img/palyazatok/ps/hatartalanul/hat_23/thumb/Nagybaromlak.jpg
            alt: Kép 3
            caption: Nagybaromlak
      - type: paragraph
        text: Hazaérkezésünk után fotókkal színesítettük beszámolónkat, amelyet az Erdélyben szerzett élményekről tartottunk diáktársainknak.
      - type: paragraph
        text: Szerencsések vagyunk, hogy lehetőséget kaptunk erre az erdélyi útra. Rengeteg tudással gazdagodtunk. Olyan határainkon kívül eső területeken játunk, ahol magyarul beszélnek, magyarként élnek az emberek. Megismerhettük hagyományaikat, népi kultúrájukat is. Minden általunk meglátogatott helyszínről előzetesen kiselőadásokkal készültünk, melyeket hol a hosszú út közben, hol a helyszíneken adtunk elő egymásnak. Esténként vetélkedőket szerveztünk, melyek során játékos formában mérhették össze frissen megszerzett tudásunkat tanulóink. Lefekvés előtt soha nem maradt el a közös játék a szabadban, vagy a társalgóban, ahol időnként spontán bulik is kialakultak. A hosszú buszúton sem unatkoztunk soha. Rengeteget nevettünk és énekeltünk. Maradandó élmény marad ez az út mindannyiunk számára, egy szép, örök emlék, mely akkor is összeköt majd bennünket, ha már nem járunk egy iskolába.

  # BS HAT-23
  - title: BS HAT23
    content:
      - type: maintitle
        text: Királyok, fejedelmek az 1000 éves határig
      - type: date
        text: 2024. június 11–15.
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_23/full/01.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_23/thumb/01.jpg
            alt: 01
      - type: paragraph
        text: 6. osztályos korunkban, valamikor május-júniusban Ági néni/ ofőnk/ úgy jött be hozzánk, hogy iskolánk pályázatot nyújt be a Határtalanul programra, ha sikerül, öt egész napot fogunk együtt eltölteni Erdélyben. Nagy volt az öröm és a várakozás. Szülői értekezleten megbeszélték a szülők, hogy mindenki benne van a dologban. Vártunk-vártunk és egyszer valamikor szeptemberben jött az osztály facebookján a hír! Megyünk, mert nyertünk!
      - type: paragraph
        text: Tudtuk, hogy sokat kell majd dolgozni vele, de már akkor éreztük, hogy biztos valami nagyon különleges élményben lesz részünk. 5 napos kirándulás! Már ekkor vártuk!
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_23/full/02.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_23/thumb/02.jpg
            alt: 02
      - type: paragraph
        text: 'A tanév során több osztályfőnöki órán beszélgettünk erről, de valamikor tavasszal lett komoly a dolog. Előkészítőórákat tartottunk: volt történelem, földrajz és általános felkészítés. Bea néni nagyon sokat mesélt Erdély történelméről, a fejedelemségről. Földrajz órákon pedig Erdély természetföldrajzával ismerkedtünk. Igazgatóhelyettes néni rengeteget járt Erdélyben, ezért ő az ott látható nevezetességekről, emberekről mesélt nekünk.'
      - type: paragraph
        text: Gyöngyi néni a székely himnuszt tanította nekünk, ami akkor túl szomorúnak tűnt nekünk. Mivel nagyon szeretünk dalolni, ezért ezt a dalt is szépen tudtuk megszólaltatni. A népi hangszerekről is tanultunk játékos, interaktív formában.
      - type: paragraph
        text: Az utolsó előkészítőóra néhány nappal az indulásunk előtt volt, itt még pontosítottunk 1-2 dolgot, összeraktuk az ajándékokat szüleink segítségével, akik legalább olyan izgatottak voltak az út miatt, mint mi. Ági néni előre gondolkozott és összeszedte a személyi igazolványunkat, nehogy a határon derüljön ki, hogy valakinek a nagy izgalomban otthon maradt. Biztosra ment.
      # első nap
      - type: heading
        text: '1. nap: indulás'
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_23/full/03.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_23/thumb/03.jpg
            alt: 03
      - type: paragraph
        text: Hajnalban a rigókkal keltünk és 4-kor már mindenki a buszmegállóban toporgott, hatalmas szemekkel. Érdekes, most senki nem aludt el, mint iskolaidőben az elsőórákról.
      - type: paragraph
        text: Gyorsan a határhoz értünk, ahol minden fennakadás nélkül átjutottunk. Első megállónk Déva vára volt. Látva a felvonót, minél előbb szerettünk volna beszállni. Azonban türelmesnek kellett lennünk, mert a 10 órás nyitásig várnunk kellett fél órát. De ami késik, nem múlik! Eljött a mi időnk, és már szállhattunk is be a kabinba. Nagyon meleg idő volt, tűzött a nap. A 250 magas sziklán büszkén jártuk be a várat.
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_23/full/04.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_23/thumb/04.jpg
            alt: 04
      - type: paragraph
        text: Utunkat folytattuk Gyulafehérvárra. Ezt a várost az Egri csillagokból már ismertük, meg töri órán Bea néni is rengeteget mesélt a Hunyadi sírról, meg az erdélyi fejedelmekről. Már nagyon vártuk az 1000 éves templomot. Mikor bementünk, tátva maradt a szánk. Csodálatos volt. Megkerestük a Hunyadi sírokat és megkoszorúztuk a törökverő és fia, a kivégzett László sírját, és folytattuk utunkat, amiről akkor még nem is tudtuk, milyen messze van.
      - type: images
        images_per_row: 1
        images:
          - full: 05.jpg
            thumb:
            alt: 05
      - type: paragraph
        text: 'Fáradtan értünk a szállásra, Székelyvarságba. Kész kaland volt, mire a busz beállt a parkolóba. Zsuzsika néni, a Csorgókő Panzió tulajdonosa a teraszon várt minket, láthatóan örült az érkezésünknek. A szállás egy luxus szállodának is beillene: minden szobához külön fürdőszoba tartozott, és általában ketten voltunk egy szobában. Az egyik tanári szoba a folyosó közepén volt, gondolom azért, hogy ne tudjunk észrevétlenül átosonni a lányokhoz. Mondjuk nehéz is lett volna, a faházban minden lépést lehetett hallani.'
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_23/full/06.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_23/thumb/06.jpg
            alt: 06
      - type: paragraph
        text: A vacsora nagyon ízlett mindenkinek. Nagy-nagy szeretettel tálalták fel nekünk mind a három a fogást. Bármit ettünk, az házi volt, mindent maguk a háziak készítettek el. 10 órakor próbálkoztak a tanáraink az altatóval, de nem sok eredménnyel. Az osztály 90 %-a szerintem semmit nem aludt.
        # 2. nap
      - type: heading
        text: 2. nap
      - type: paragraph
        text: Reggel 6:45 volt az ébresztő, készülődés, reggeli után ismét buszra szálltunk. Tudtuk, hogy mire számíthatunk aznap, mert tanáraink mindig részletesen elmondták a programot, és azt is, mi kerüljön bele a hátizsákba. Ekkor még nem is sejtettük, hogy milyen izgalmakban lesz részünk. Olyan jól éreztük magunkat a busz hátuljában, hogy észre sem vettük, mikor szállt fel hozzánk Robi, a túravezetőnk. Nagyon érdekesen beszélt. Értettük minden szavát, de mégis másként fejezte ki magát, mint mi. Tőle tanultuk a veddfelke kifejezést, amit a hátizsákunkba tettünk arra az időre, ha a barlangban fáznánk. Egy rövid, de nehéz túra után jutottunk el a Sugó-barlanghoz, ahova fejlámpával be is mentünk.
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_23/full/07.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_23/thumb/07.jpg
            alt: 07
      - type: paragraph
        text: Kicsit csúszós volt bent az út, és néhol nagyon le kellett hajolni. Aki nem tette meg, vagy nem figyelt, az bizony beverte a kobakját. Robitól tudom, hogy ez a barlang a Gyergyói medence legjelentősebb helye, a különleges denevéreivel együtt. Igaza volt a túravezetőnek, mert a 7-12 fokos helyen szükségünk volt a veddfelkére.
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_23/full/08.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_23/thumb/08.jpg
            alt: 08
      - type: paragraph
        text: Ezután buszon jutottunk el a Gyilkos-tóig, ahol mindenekelőtt egy helyi kürtőskalácsot kapott mindenki, ami életem legfinomabb kürtőskalácsa volt. A Békás-szorost gyalog jártuk be, ami a nevét a mellette húzódó Békás patakról kapta, amely egyben a kialakítója is volt.
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_23/full/09.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_23/thumb/09.jpg
            alt: 09
      - type: paragraph
        text: Robi mutatott nekünk egy különleges helyet, a kis Békást. Azt mondta, ezt a helyet csak a legjobb gyerekeknek mutatja meg, mert egy igazi függőhídon keltünk át. Kettőt tervezett, de kaptunk egy medve riasztást, ezért az első híd átkelése után visszafordultunk.
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_23/full/10.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_23/thumb/10.jpg
            alt: 10
      - type: paragraph
        text: A Gyilkos-tóról már tanultunk Laci bácsitól, itt Robi is megmutatta, hogy hogyan keletkezett földcsuszamlással. Próbáltuk jól az emlékezetünkbe vésni ezt a különleges látványt, mert a kiálló fatörzsek sajnos nem maradnak meg mindig.
      - type: paragraph
        text: Estére a szállásra érve Zsuzsika néni ismét finomat főzött nekünk, mind a tíz ujjunkat megnyaltuk vacsora után. Ez egy igazi családi vállalkozás, mindenki azért dolgozik, hogy mi vendégek jól érezzük magunkat. Ez meg is történt, mert a közös játéknak tanáraink 10 órakor is alig tudtak véget vetni.
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_23/full/11.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_23/thumb/11.jpg
            alt: 11
      - type: heading
        # 3. nap
        text: 3. nap
      - type: paragraph
        text: Korán keltünk, mert tanáraink azt mondták, ma messzire látogatunk. Izgatottan vártuk ezt a napot, mert a kis ajándékokat adjuk át a Dani Gergely Általános Iskola szintén hetedikes tanulóinak.
      - type: paragraph
        text: Az oda vezető út gyönyörű volt és hosszú. Alig vártuk a találkozást a diákokkal. Amint megérkeztünk az iskola elé, feltűnt, hogy vmilyen népviseletben jönnek ki a tanulók az iskolából. Katinka néni elmondta, hogy most ért véget a ballagás, itt ez az ünneplő ruha. Nagyon furcsa volt nekünk. A tornateremben történt meg a nagy találkozás. Igazából ugyanolyan gyerekek, mint mi. Az igazgatónő kedvesen köszöntött minket, majd egyikünk bemutatta az iskolánkat, ahonnan jöttünk. Ezután táncoltak, zenéltek nekünk. Nagyon érdekes volt, mert nekik nem kellett mikrofon, hogy halljuk, olyan hangosan tudtak énekelni. Közös éneklésbe is kezdtünk, először a Tavaszi szél kezdetű népdalt daloltuk együtt.
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_23/full/12.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_23/thumb/12.jpg
            alt: 12
      - type: paragraph
        text: Az igazgatónő kérésére, hogy énekeljünk még egyet, egyikünk azt mondta, hogy a székely himnuszt is énekeljük el. Ilyen szépen, még sohasem szólt. Valami volt a levegőben, mert mindannyian éreztük, hogy most történik valami, bennünk. Innen kezdve felszabadultan kerestük egymás társaságát, táncoltunk, beszélgettünk egymással. Amíg nem esett az eső, az udvaron fociztunk is.
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_23/full/13.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_23/thumb/13.jpg
            alt: 13
      - type: paragraph
        text: Nehéz volt otthagyni őket, de megfogadtuk, hogy Instán és Fb-on tartani fogjuk a kapcsolatot. Így is lett, sokan levelezünk velük a mai napig.
      - type: paragraph
        text: 'Innen az ezeréves határhoz vitt utunk. Kicsit borús idő kísért minket. Az itt álló vasúti őrházat is megnéztük, még szerettük volna a Rákóczi várat is látni, de még felújítás miatt zárva volt. A Kontumáci kápolnánál gyülekeztünk, ahol a helyi idegenvezető, Fülöp megtanította nekünk, hogy kik azok a csángók, és hogy háromféle csoportja létezik: a moldvai, a gyimesi és a hétfalusi. Nagyon kedves ember, mert meghívott minket a saját esztennájába, amiről addig nem is tudtuk, mi az.'
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_23/full/14.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_23/thumb/14.jpg
            alt: 14
      - type: paragraph
        text: Ez az a hely, ahova kiköltöznek az állatokkal tavasszal és a tél beálltáig itt is maradnak. A sajtkészítés folyamatát is bemutatta nekünk, bár a lányok az oltógyomornál rosszul is lettek.
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_23/full/15.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_23/thumb/15.jpg
            alt: 15
      - type: paragraph
        text: Tábortüzet is rakott nekünk, ahol mindenki magának sütögethette a szalonnáját, kolbászát. Igazi házi pityókás kenyeret adott hozzá Fülöp, ami nagyon ízletes volt.
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_23/full/16.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_23/thumb/16.jpg
            alt: 16
      - type: paragraph
        text: Háromféle sajtot kóstolhattunk, mindenkinek a középső volt a legfinomabb, annak legalább volt íze.
      - type: paragraph
        text: Az esztena körül kicsit kóboroltunk a domboldalon, majd az ofő unszolására búcsút intettünk ennek a szép helynek, utaztunk vissza a bázisunkra, Zsuzsika nénihez, aki finom vacsorával várt bennünket. Most a kis unokája is segített a tálalásban, pedig csak öt éves, nagyon aranyos volt.
      - tpye: paragraph
        text: A szállásunk mellett volt egy kis kutya, akivel lehetett játszani is, jól tűrte a közeledésünket.
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_23/full/17.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_23/thumb/17.jpg
            alt: 17
      - type: heading
        #  4. nap
        text: 4. nap
      - type: paragraph
        text: Reggel korán keltünk, majd megreggeliztünk és szendvicseket készítettünk az útra. Ezt követően indultunk Szejkefürdőre, ahol egy székely kapukkal átívelt úton keresztül mentünk fel Orbán Balázs sírjához, amit szintén megkoszorúztunk.
      - type: paragraph
        text: Esős időben érkeztünk Korondra Zoli bácsihoz és Erzsike nénihez. Zoli bácsi tapló gombából készít különböző tárgyakat. El is mesélte nekünk, milyen nagy szaktudás kell ahhoz, hogy ezt a gombát megtalálja, és meg is tudja munkálni. Legtöbben egy kis egeret vásároltunk, amit hűtőmágnesnek hoztuk haza, na meg a lányokat ijesztgetni vele.
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_23/full/18.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_23/thumb/18.jpg
            alt: 18
      - type: paragraph
        text: Ezt követően tértünk vissza Székelyudvarhelyre, ahol az Emlékezés Parkját kerestük fel. Koszorúzásra, megemlékezésekre került sor.
      - type: paragraph
        text: Sajnos a parajdi sóbánya zárva volt biztonsági okokból, ezért Katinka néni egy másik programot szervezett nekünk. A szállásunkról szekereken indultunk neki az erdőnek, jó zötyögős úton. Minket azonban ez sem zavart, mert útközben jókat beszélgettünk egymással.
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_23/full/19.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_23/thumb/19.jpg
            alt: 19
      - type: paragraph
        text: A táj ismét gyönyörű volt, megálltunk a Csorgókő vízesésnél, akinek vízálló cipője volt, a patakban gázolhatott is. Persze az is vizes lett, akinek nem volt ilyen cipője. Ezután egy több emeletes kilátóból néztünk a 360 fokos panorámát. A lovakhoz tartozott két csikó is, akik szabadon követtek minket. Ha elkóboroltak, a terelő kutya azonnal ugatásával visszavezette őket a szekerek mellé. Nagyon vicces volt látni, milyen komolyan veszi a kutya a feladatát, és valóban az is volt.
      - type: images
        images_per_row: 2
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_23/full/20.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_23/thumb/20.jpg
            alt: 20
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_23/full/21.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_23/thumb/21.jpg
            alt: 21
      - type: paragraph
        text: Eljött az utolsó éjszaka, az utolsó finom, házi vacsora. Töltött káposzta és almáspite volt a meglepetés fogás a leves után. Mondanom sem kell, hogy ilyen finomat még nem ettem életemben. Megköszöntük Zsuzsa néniéknek a vendégszeretetét, és hogy mindig finom vacsorával várt minket. Mindenki elérzékenyült.
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_23/full/22.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_23/thumb/22.jpg
            alt: 22
      - type: paragraph
        text: Szomorúan pakoltunk össze a bőröndükbe estére, senki sem akart hazamenni, szívesen maradtunk volna még itt.
      - type: heading
        # 5. nap
        text: 5. nap
      - type: paragraph
        text: Korán keltünk, bepakoltunk a buszba és elmentünk reggelizni, mert utána Fehéregyházáig meg sem álltunk. Itt a múzeum gondnoka elmondta, hogy három tömegsír van, ahol Petőfi maradványa lehet. Szerinte nem ebben a tömegsírban nyugszik a nagy költő, de az emlékezés szobránál elhelyeztük koszorúnkat és tovább indultunk Segesvár felé.
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_23/full/23.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_23/thumb/23.jpg
            alt: 23
      - type: paragraph
        text: Itt az óratotnyot néztük meg, melynek két számlapja közül az egyik a város felé, a másik a vár felé néz. Itt láttuk Drakula szülőházát, ami most étteremként működik. Megmásztuk a diákok lépcsőjét, de mindenki más fokot számolt a hivatalos 175 lépcső helyett. Visszatérve az egyetemi épülettől fagyiztunk egyet és folytattuk utunkat Nagybaromlak felé.
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_23/full/24.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_23/thumb/24.jpg
            alt: 24
      - type: paragraph
        text: Ez egy erődtemplom, amit a szászok használnak, akik még itt maradtak. Felmászhattunk a harangok közé elég félelmetes csigalépcsőn keresztül. Valamelyikünk megszólaltatta a harangot, nagyon hangos volt.
      - type: paragraph
        text: Ezután megkezdtük 6 órás utunkat hazafelé Szegedre. Nagylaknál olyan hosszú kamionsor volt, hogy megijedtünk, soha nem jutunk át. Szerencsére a sofőrünk tudta melyik sorba kell állni és gyorsan átértünk a határon. 8-ra értünk haza, már a szülők ott tolongtak az iskola előtt. Elfáradtunk, de megérte, hiszen sok szép tájat láttunk.
      - type: heading
        text: Értékelő óra
      - type: paragraph
        text: Itt magunk között voltunk, illetve meghívtuk a felkészítő tanárainkat is. Itt mindenki értékelte a kirándulást, elmondta a jó és rossz élményeket, tapasztalatokat. Közös munkával fotókat válogattunk az iskolai facebookra és digitális tábla segítségével megnéztük a képeket és az elkészült videókat. Jókat nevettünk, mert eszünkbe jutottak a szép emlékek és a sok gondtalan perc.
      - type: heading
        text: Témanap
      - type: paragraph
        text: Úgy gondoltuk, hogy ezt a rengeteg dolgot amit láttunk és történt velünk, azt mindenképpen érdemes megosztani a társainkkal, ezért szerveztünk egy kis bemutatót. Itt előadtuk a dalokat amiket tanultunk, megkínáltuk őket az Erdélyből hozott lekváros kenyérrel és rengeteg élményt osztottunk meg velük.
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_23/full/25.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_23/thumb/25.jpg
            alt: 25
      - type: paragraph
        text: Röviden összefoglalva kedves naplónk, ezek történtek. Köszönjük az Emberi Erőforrás Minisztériumának a pályázati támogatást, a sok kedves embernek, akik segítettek minket az utunk során, és persze ofőnek azt, hogy el mert minket vinni és végig kitartott mellettünk.
      - type: images
        images_per_row: 1
        images:
          - full: /assets/img/palyazatok/bs/hatartalanul/hat_23/full/26.jpg
            thumb: /assets/img/palyazatok/bs/hatartalanul/hat_23/thumb/26.jpg
            alt: 26

  - title: PS|BS HAT22
    content:
      - type: maintitle
        text: Királyok, fejedelmek az 1000 éves határ mentén – Hamarosan...
      - type: date
        text: 2023. május 17–21.
      - type: paragraph
        text: Iskolánk hetedik osztályos tanulóival a Határtalanul! pályázat keretében 2023. május 17- 21. között Erdélybe utazhattunk, ahol az ott eltöltött öt nap során rendkívül sok érdekes és izgalmas program várt bennünket.
      - type: heading
        text: Első nap
      - type: paragraph
        text: Az indulás napján nagyon korán kellett kelnünk, hiszen hosszú út állt előttünk. Hajnali négy órakor álmosan gyülekeztünk az iskola előtt a buszra várva. Kezdeti fáradtságunk hamar elszállt, hiszen a székelyvarsági szállásra vezető utunkat többször is megszakítottuk egy-egy izgalmas helyszínen.
      - type: paragraph
        text: Déva váránál álltunk meg először. Az időjárás kegyes volt hozzánk, érkezésünkkor már elállt az eső, így nem volt akadálya annak, hogy gyalog tegyük meg a várhoz vezető hosszú utat. Megérte az erőfeszítést, mivel innen gyönyörű kilátás nyílt a környező hegyekre.
      - type: images
        images_per_row: 3
        images:
          - full: /assets/img/palyazatok/kozos/hatartalanul/hat_22/full/1_1_deva.jpg
            thumb: /assets/img/palyazatok/kozos/hatartalanul/hat_22/thumb/1_1_deva.jpg
            alt: 01
            caption: Déva
          - full: /assets/img/palyazatok/kozos/hatartalanul/hat_22/full/1_2_deva.jpg
            thumb: /assets/img/palyazatok/kozos/hatartalanul/hat_22/thumb/1_2_deva.jpg
            alt: 02
            caption: Déva
          - full: /assets/img/palyazatok/kozos/hatartalanul/hat_22/full/1_3_deva.jpg
            thumb: /assets/img/palyazatok/kozos/hatartalanul/hat_22/thumb/1_3_deva.jpg
            alt: 03
            caption: Déva
      - type: paragraph
        text: Folytattuk utunkat Gyulafehérvárra, ahol megtekintettük a székesegyházat, majd a Károly-kapun átsétálva megcsodáltuk a gyönyörű tájat.
      - type: paragraph
        text: Fehéregyházán felkerestük a Petőfi Múzeumot, ahol egy lebilincselő előadás meghallgatása után egy koszorú elhelyezésével emlékeztünk meg Petőfi Sándorról és elénekeltük a Székely himnuszt.
      - type: images
        images_per_row: 3
        images:
          - full: /assets/img/palyazatok/kozos/hatartalanul/hat_22/full/1_4_a_Gyulafehérvár.jpg
            thumb: /assets/img/palyazatok/kozos/hatartalanul/hat_22/thumb/1_4_a_Gyulafehérvár.jpg
            alt: 01
            caption: Gyulafehérvár
          - full: /assets/img/palyazatok/kozos/hatartalanul/hat_22/full/1_4_b_Gyulafehérvár.jpg
            thumb: /assets/img/palyazatok/kozos/hatartalanul/hat_22/thumb/1_4_b_Gyulafehérvár.jpg
            alt: 01
            caption: Gyulafehérvár
          - full: /assets/img/palyazatok/kozos/hatartalanul/hat_22/full/1_5_Fehéregyháza.jpg
            thumb: /assets/img/palyazatok/kozos/hatartalanul/hat_22/thumb/1_5_Fehéregyháza.jpg
            alt: 01
            caption: Fehéregyháza
      - type: paragraph
        text: Innen utunk a szállásunkra vezetett, a székelyvarsági Csorgókő Panzióba. Itt igen kedves fogadtatásban volt részünk. Az egész napos fárasztó túrázás után nagyon jól esett a finom, meleg vacsora.
# 03
      - type: images
        images_per_row: 3
        images:
          - full: /assets/img/palyazatok/kozos/hatartalanul/hat_22/full/1_6_Fehéregyháza.jpg
            thumb: /assets/img/palyazatok/kozos/hatartalanul/hat_22/thumb/1_6_Fehéregyháza.jpg
            alt: 01
            caption: Fehéregyháza
          - full: /assets/img/palyazatok/kozos/hatartalanul/hat_22/full/1_7_székelyvarság.jpg
            thumb: /assets/img/palyazatok/kozos/hatartalanul/hat_22/thumb/1_7_székelyvarság.jpg
            alt: 02
            caption: Fehéregyháza
          - full: /assets/img/palyazatok/kozos/hatartalanul/hat_22/full/1_3_1_8_székelyvarságeva.jpg
            thumb: /assets/img/palyazatok/kozos/hatartalanul/hat_22/thumb/1_8_székelyvarság.jpg
            alt: 03
            caption: Székelyvarság
      - type: heading
        text: Második nap
      - type: paragraph
        text: Kirándulásunk második napjának reggelén ellátogattunk a székelyudvarhelyi Emlékezet parkjába, ahol 13 magyar király, író és egyéb híres ember szobránál tettük tiszteletünket. Ezután Szejkefürdőn jártunk, megtekintettük a Székelykapu Múzeumot és Orbán Balázs sírhelyét. Innen Korondra utaztunk és a verőfényes napsütésben helyi kézművesek termékeiből vásárolgattunk.
      - type: images
        images_per_row: 3
        images:
          - full: /assets/img/palyazatok/kozos/hatartalanul/hat_22/full/2_1_Székelyudvarhely.jpg
            thumb: /assets/img/palyazatok/kozos/hatartalanul/hat_22/thumb/2_1_Székelyudvarhely.jpg

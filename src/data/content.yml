            alt: 01
            caption: Gyimesbükk
          - full: /assets/img/palyazatok/kozos/hatartalanul/hat_22/full/3_5_Gyimesbükk.jpg
            thumb: /assets/img/palyazatok/kozos/hatartalanul/hat_22/thumb/3_5_Gyimesbükk.jpg
            alt: 02
            caption: Gyimesbükk
          - full: /assets/img/palyazatok/kozos/hatartalanul/hat_22/full/3_6_Gyimesbükk.jpg
            thumb: /assets/img/palyazatok/kozos/hatartalanul/hat_22/thumb/3_6_Gyimesbükk.jpg
            alt: 03
            caption: Gyimesbükk            
      - type: paragraph
        text: Egy helyi idegenvezető megismertette velünk a gyimesi csángók történetét. Hazafelé menet útba ejtettük az ezeréves határt is.
      - type: images
        images_per_row: 3
        images:
          - full: /assets/img/palyazatok/kozos/hatartalanul/hat_22/full/3_7_Gyimesbükk.jpg

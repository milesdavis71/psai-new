          - full: /assets/img/palyazatok/kozos/hatartalanul/hat_22/full/3_8_Gyimesbükk.jpg
            thumb: /assets/img/palyazatok/kozos/hatartalanul/hat_22/thumb/3_8_Gyimesbükk.jpg
            alt: 02
            caption: Gyimesbükk
          - full: /assets/img/palyazatok/kozos/hatartalanul/hat_22/full/3_9_Ezeréves_határ.jpg
            thumb: /assets/img/palyazatok/kozos/hatartalanul/hat_22/thumb/3_9_Ezeréves_határ.jpg
            alt: 03
            caption: Ezeréves határ 
      - type: heading
        text: Negyedik nap
      - type: paragraph
        text: Erdélyi tartózkodásunk negyedik napján korán reggel a Súgó - barlang felé vettük az irányt. Miután megküzdöttünk a meredek hegyoldallal, a barlangban cseppkövek csodálatos látványa fogadott bennünket. A barlang mélyén lekapcsoltuk a zseblámpákat, hogy kipróbáljuk, milyen érzés teljes csendben és vaksötétben lenni.
      - type: images
        images_per_row: 3
        images:
          - full: /assets/img/palyazatok/kozos/hatartalanul/hat_22/full/4_1_a_Súgó-barlang.jpg
            thumb: /assets/img/palyazatok/kozos/hatartalanul/hat_22/thumb/4_1_a_Súgó-barlang.jpg
            alt: 01
            caption: Súgó-barlang
          - full: /assets/img/palyazatok/kozos/hatartalanul/hat_22/full/4_1_b_Súgó-barlang.jpg
            thumb: /assets/img/palyazatok/kozos/hatartalanul/hat_22/thumb/4_1_b_Súgó-barlang.jpg
            alt: 01
            caption: Súgó-barlang
          - full: /assets/img/palyazatok/kozos/hatartalanul/hat_22/full/4_3_Lázár-kastély.jpg
            thumb: /assets/img/palyazatok/kozos/hatartalanul/hat_22/thumb/4_3_Lázár-kastély.jpg
            alt: 03
            caption: Lázár-kastély 
      - type: paragraph
        text: A Súgó-barlangból egy újabb csodálatosan szép természeti jelenséghez, a Gyilkos-tóhoz indultunk. Útközben megálltunk megnézni a Lázár-kastélyt. A Gyilkos-tónál finom kürtős kalácsot ettünk, hogy legyen energiánk a hosszú sétához a Békás-szorosban. Lélegzetelállítóan gyönyörű látványt nyújt a Békás-patak és az azt körülölelő hatalmas sziklafalak. Igazi természeti ritkaság, amit itt láthattunk.
      - type: images
        images_per_row: 3
        images:
          - full: /assets/img/palyazatok/kozos/hatartalanul/hat_22/full/4_2_Gyilkos-tó.jpg
            thumb: /assets/img/palyazatok/kozos/hatartalanul/hat_22/thumb/4_2_Gyilkos-tó.jpg
            alt: 01
            caption: Gyilkos-tó
          - full: /assets/img/palyazatok/kozos/hatartalanul/hat_22/full/4_4_Békás-szoros.jpg

            alt: 02
            caption: Szejkefürdő
          - full: /assets/img/palyazatok/kozos/hatartalanul/hat_22/full/2_3_Szejkekapu.jpg
            thumb: /assets/img/palyazatok/kozos/hatartalanul/hat_22/thumb/2_3_Szejkekapu.jpg
            alt: 03
            caption: Szejkefürdő
      - type: paragraph
        text: Ebéd után a parajdi sóbányában kapcsolódhattunk ki. Az egészségünknek kedvező környezetben néhány órát pihenéssel töltöttünk el.
      - type: images
        images_per_row: 3
        images:
          - full: /assets/img/palyazatok/kozos/hatartalanul/hat_22/full/2_4_Korond-sóbánya.jpg
            thumb: /assets/img/palyazatok/kozos/hatartalanul/hat_22/thumb/2_4_Korond-sóbánya.jpg
            alt: 01
            caption: Parajdi sóbánya
          - full: /assets/img/palyazatok/kozos/hatartalanul/hat_22/full/2_5_Korond-sóbánya.jpg
            thumb: /assets/img/palyazatok/kozos/hatartalanul/hat_22/thumb/2_5_Korond-sóbánya.jpg
            alt: 02
            caption: Parajdi sóbánya
          - full: /assets/img/palyazatok/kozos/hatartalanul/hat_22/full/2_6_Korond-sóbánya.jpg
            thumb: /assets/img/palyazatok/kozos/hatartalanul/hat_22/thumb/2_6_Korond-sóbánya.jpg
            alt: 03
            caption: Parajdi sóbánya
      - type: paragraph
        text: Délután visszautaztunk Korondra, ahol egy egészen különös szakma művelőivel, taplász-mesterekkel ismerkedtünk meg. Megmutatták nekünk, hogy hogyan készítenek táskát, kendőt, sapkát és különböző dísztárgyakat taplógombából.
      - type: images
        images_per_row: 3
        images:
          - full: /assets/img/palyazatok/kozos/hatartalanul/hat_22/full/2_7_Korond-sóbánya.jpg
            thumb: /assets/img/palyazatok/kozos/hatartalanul/hat_22/thumb/2_7_Korond-sóbánya.jpg
            alt: 01
            caption: Parajdi sóbánya
          - full: /assets/img/palyazatok/kozos/hatartalanul/hat_22/full/2_8_Korond-taplász-mesterek.jpg
            thumb: /assets/img/palyazatok/kozos/hatartalanul/hat_22/thumb/2_8_Korond-taplász-mesterek.jpg
            alt: 02
            caption: Korond
          - full: /assets/img/palyazatok/kozos/hatartalanul/hat_22/full/2_9_Korond-taplász-mesterek.jpg

          - full: /assets/img/palyazatok/kozos/hatartalanul/hat_22/full/3_3_csíkszeredai-Nagy-István-Művészeti-Középiskola.jpg
            thumb: /assets/img/palyazatok/kozos/hatartalanul/hat_22/thumb/3_3_csíkszeredai-Nagy-István-Művészeti-Középiskola.jpg
            alt: 03
            caption: Csíkszereda
      - type: paragraph
        text: Délután egy újabb csodaszép táj megtekintésére volt lehetőségünk. Gyimesbükkbe látogattunk el. Lovas szekerekkel mentünk fel a hegyek közé, ahol egy esztenánál szalonnát és kolbászt sütöttünk, valamint házi készítésű sajtot kóstoltunk.
      - type: images
        images_per_row: 3
        images:
          - full: /assets/img/palyazatok/kozos/hatartalanul/hat_22/full/3_4_Gyimesbükk.jpg
